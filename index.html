<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GARNET-26 Chat</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #111;
    color: #eee;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }

  .chat-container {
    flex: 1;
    min-width: 0;
    background: #111;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .chat-header {
    background-color: #000;
    color: white;
    padding: 16px;
    text-align: center;
    font-size: 22px;
    font-weight: bold;
    border-bottom: 1px solid #d9a441;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .chat-title-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    line-height: 1.3;
  }

  #chatHeaderSubtitle {
    font-size: 11px;
    font-weight: bold;
    letter-spacing: 0.5px;
    color: #d9a441;
    margin-top: 2px;
  }

  #backToSiteBtn {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    display: flex;
    align-items: center;
  }

  #backToSiteBtn:hover {
    opacity: 0.8;
  }

  #backLogo {
    height: 38px;
    width: auto;
    display: block;
  }

  .app-layout {
    display: flex;
    width: 100vw;
    height: 100dvh;
    height: 100vh;
    height: 100dvh;
  }

  .sidebar {
    width: 130px;
    flex-shrink: 0;
    background: #000;
    border-right: 1px solid #d9a441;
    display: flex;
    flex-direction: column;
    height: 100%;
  }

  .sidebar-top {
    padding: 8px;
    border-bottom: 1px solid #2a2a2a;
  }

  #sidebarNewChatBtn {
    width: 100%;
    padding: 8px 4px;
    background: #d9a441;
    color: #111;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    font-size: 12px;
    cursor: pointer;
  }

  #sidebarNewChatBtn:hover {
    opacity: 0.9;
  }

  .chat-history-list {
    flex: 1;
    overflow-y: auto;
    padding: 6px;
  }

  .chat-history-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 3px;
    padding: 7px 6px;
    border-radius: 7px;
    color: #ddd;
    font-size: 11px;
    cursor: pointer;
    margin-bottom: 3px;
  }

  .chat-history-item:hover {
    background: #1c1c1c;
  }

  .chat-history-item.active-chat {
    background: #262626;
    border: 1px solid #d9a441;
  }

  .chat-history-item.pending-chat {
    border: 1px dashed #666;
    color: #999;
    cursor: default;
  }

  .chat-history-item-title {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .chat-history-delete-btn {
    background: none;
    border: none;
    color: #888;
    cursor: pointer;
    font-size: 12px;
    padding: 1px 3px;
    flex-shrink: 0;
  }

  .chat-history-delete-btn:hover {
    color: #e05252;
  }

  .chat-history-empty {
    color: #666;
    font-size: 11px;
    padding: 8px 4px;
    text-align: center;
  }

  .sidebar-bottom {
    border-top: 1px solid #2a2a2a;
    padding: 8px;
  }

  .account-wrapper {
    position: relative;
    margin-bottom: 6px;
  }

  #accountBtn {
    width: 100%;
    padding: 7px 4px;
    background: rgba(255, 255, 255, 0.08);
    color: #ccc;
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 7px;
    font-size: 11px;
    cursor: pointer;
  }

  #accountBtn:hover {
    background: rgba(255, 255, 255, 0.15);
  }

  .account-dropdown {
    position: absolute;
    bottom: 100%;
    left: 0;
    right: 0;
    margin-bottom: 6px;
    background: #1c1c1c;
    border: 1px solid #444;
    border-radius: 8px;
    padding: 10px 8px;
    z-index: 20;
  }

  .account-dropdown-name {
    color: white;
    font-size: 12px;
    font-weight: bold;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .account-dropdown-email {
    color: #999;
    font-size: 10.5px;
    margin-top: 2px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .account-dropdown hr {
    border: none;
    border-top: 1px solid #333;
    margin: 8px 0;
  }

  .account-dropdown-link {
    display: block;
    color: #d9a441;
    font-size: 11px;
    text-decoration: none;
    margin-bottom: 6px;
  }

  .account-dropdown-link:hover {
    text-decoration: underline;
  }

  .account-dropdown-privacy-note {
    color: #777;
    font-size: 10px;
    line-height: 1.4;
  }

  #sidebarLogoutBtn {
    width: 100%;
    padding: 7px;
    background: rgba(255, 255, 255, 0.1);
    color: white;
    border: 1px solid rgba(255, 255, 255, 0.3);
    border-radius: 7px;
    font-size: 11px;
    cursor: pointer;
  }

  #sidebarLogoutBtn:hover {
    background: rgba(255, 255, 255, 0.2);
  }

  .chat-box {
    flex: 1;
    padding: 18px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    scroll-behavior: smooth;
  }

  .message {
    margin: 10px 0;
    padding: 10px 16px;
    border-radius: 12px;
    max-width: 80%;
    word-wrap: break-word;
    line-height: 1.5;
    position: relative;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .user-message {
    background-color: #d9a441;
    color: #111;
    align-self: flex-end;
    text-align: right;
  }

  .bot-message {
    background-color: #222;
    align-self: flex-start;
    text-align: left;
  }

  .copy-btn {
    background: none;
    border: none;
    cursor: pointer;
    opacity: 0.7;
    transition: opacity 0.2s, transform 0.2s;
  }

  .copy-btn svg {
    width: 20px;
    height: 20px;
    fill: none;
    stroke: white;
    stroke-width: 2;
  }

  .copy-btn:hover {
    opacity: 1;
    transform: scale(1.1);
  }

  .chat-input {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-top: 1px solid #333;
    background: #000;
    padding: 8px 12px;
  }

  .options {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .options button {
    background: #333;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 20px;
    padding: 6px 10px;
  }

  .options button.active {
    background: #d9a441;
    color: #111;
  }

  .options button:hover {
    background: #444;
  }

  .chat-input input {
    flex: 1;
    margin: 0 12px;
    border: none;
    padding: 12px;
    font-size: 16px;
    outline: none;
    background: #000;
    color: white;
    border-radius: 8px;
  }

  .chat-input input:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .options button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  #sendBtn {
    background: none;
    border: none;
    cursor: pointer;
  }

  #sendBtn img {
    width: 30px;
    height: 30px;
    filter: invert(100%);
    opacity: 0.9;
  }

  #sendBtn img:hover {
    opacity: 1;
    transform: scale(1.05);
  }

  .thinking::after {
    content: ' .';
    animation: dots 1.5s steps(3, end) infinite;
  }

  @keyframes dots {
    0%, 20% { content: ' .'; }
    40% { content: ' ..'; }
    60% { content: ' ...'; }
    80%, 100% { content: ' ....'; }
  }

  @media (max-width: 768px) {
    .chat-header {
      font-size: 17px;
      padding: 12px 8px;
    }
    #backToSiteBtn {
      font-size: 11px;
      padding: 5px 8px;
    }
    .app-layout {
      flex-direction: column;
    }
    .sidebar {
      width: 100%;
      height: 40vh;
      border-right: none;
      border-bottom: 1px solid #d9a441;
    }
  }

  .bot-message a {
    color: #d9a441;
    font-weight: bold;
    text-decoration: underline;
  }

  .bot-message h1 {
    font-size: 21px;
    font-weight: bold;
    margin: 4px 0 10px 0;
    line-height: 1.3;
  }

  .bot-message h2 {
    font-size: 18px;
    font-weight: bold;
    margin: 10px 0 6px 0;
    line-height: 1.3;
  }

  .bot-message h3 {
    font-size: 15.5px;
    font-weight: bold;
    margin: 8px 0 4px 0;
    line-height: 1.3;
    opacity: 0.95;
  }

  .bot-message p {
    font-size: 15px;
    margin: 6px 0;
  }

  .bot-message ul, .bot-message ol {
    margin: 6px 0;
    padding-left: 22px;
  }

  .price-chart {
    width: 100%;
    max-width: 640px;
    height: 280px;
    margin: 10px 0;
    position: relative;
  }
  .auth-gate {
    position: fixed;
    inset: 0;
    z-index: 10000;
    background: #111;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-y: auto;
    padding: 20px;
    box-sizing: border-box;
  }

  .auth-box {
    text-align: center;
    max-width: 360px;
    width: 100%;
    padding: 20px;
  }

  .auth-logo {
    width: 64px;
    height: auto;
    margin-bottom: 12px;
  }

  .auth-box h2 {
    color: white;
    margin: 0 0 20px 0;
  }

  .auth-panel input[type="email"],
  .auth-panel input[type="password"] {
    width: 100%;
    box-sizing: border-box;
    padding: 12px;
    font-size: 15px;
    border: 1px solid #444;
    border-radius: 8px;
    background: #000;
    color: white;
    margin-bottom: 10px;
  }

  .auth-panel button {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    font-weight: bold;
    background: #d9a441;
    color: #111;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    margin-top: 4px;
  }

  .auth-panel button:hover {
    opacity: 0.9;
  }

  .auth-instructions {
    color: #ccc;
    font-size: 13px;
    margin: 0 0 14px 0;
  }

  .terms-check {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    text-align: left;
    color: #ccc;
    font-size: 13px;
    margin: 6px 0 12px 0;
    cursor: pointer;
  }

  .terms-check input {
    margin-top: 3px;
    flex-shrink: 0;
  }

  .terms-check a {
    color: #d9a441;
  }

  .auth-error {
    color: #e05252;
    font-size: 13px;
    min-height: 16px;
    margin: 8px 0 0 0;
  }

  .auth-success {
    color: #6fbf6f;
    font-size: 13px;
    min-height: 16px;
    margin: 4px 0 0 0;
  }

  .auth-links {
    text-align: right;
    margin: 8px 0 0 0;
  }

  .auth-links a, .auth-switch a {
    color: #d9a441;
    font-size: 13px;
    text-decoration: none;
  }

  .auth-links a:hover, .auth-switch a:hover {
    text-decoration: underline;
  }

  .auth-switch {
    color: #999;
    font-size: 13px;
    margin: 16px 0 0 0;
  }

</style>
</head>
<body>

<!-- ✅ AUTHENTICATION GATE: real per-user accounts via Firebase
     Authentication (Google's free auth service) -- NOT a shared
     password. Each visitor creates their own account (email + password)
     and signs in with their own credentials. "Forgot password" sends a
     REAL password-reset email through Firebase, not a fake button.
     Firebase's config values below (apiKey, authDomain, etc.) are
     CLIENT-SIDE PUBLIC values by design -- Firebase's own security model
     expects them to be visible in your app's source code; real access
     control is enforced server-side by Firebase itself, not by hiding
     these values. You still need to fill in YOUR OWN project's values
     below (see firebaseConfig) after creating a free Firebase project. -->
<div id="authGate" class="auth-gate">
  <div class="auth-box">
    <img src="logo.png" alt="Institute of AI" class="auth-logo">
    <h2>GARNET-26 Chat</h2>

    <!-- SIGN IN PANEL -->
    <div id="signInPanel" class="auth-panel">
      <input type="email" id="signInEmail" placeholder="Email" autocomplete="username">
      <input type="password" id="signInPassword" placeholder="Password" autocomplete="current-password">
      <button onclick="handleSignIn()">Sign In</button>
      <p class="auth-error" id="signInError"></p>
      <p class="auth-links">
        <a href="#" onclick="showPanel('forgotPanel'); return false;">Forgot password?</a>
      </p>
      <p class="auth-switch">Don't have an account?
        <a href="#" onclick="showPanel('signUpPanel'); return false;">Sign up</a>
      </p>
    </div>

    <!-- SIGN UP PANEL -->
    <div id="signUpPanel" class="auth-panel" style="display:none;">
      <input type="text" id="signUpName" placeholder="Full name" autocomplete="name">
      <input type="email" id="signUpEmail" placeholder="Email" autocomplete="username">
      <input type="password" id="signUpPassword" placeholder="Password (min. 6 characters)" autocomplete="new-password">
      <input type="password" id="signUpPasswordConfirm" placeholder="Confirm password" autocomplete="new-password">
      <label class="terms-check">
        <input type="checkbox" id="agreeTerms">
        <span>I agree to the <a href="terms.html" target="_blank" rel="noopener">Terms &amp; Conditions</a></span>
      </label>
      <button onclick="handleSignUp()">Sign Up</button>
      <p class="auth-error" id="signUpError"></p>
      <p class="auth-switch">Already have an account?
        <a href="#" onclick="showPanel('signInPanel'); return false;">Sign in</a>
      </p>
    </div>

    <!-- FORGOT PASSWORD PANEL -->
    <div id="forgotPanel" class="auth-panel" style="display:none;">
      <p class="auth-instructions">Enter your email and we'll send you a password reset link.</p>
      <input type="email" id="forgotEmail" placeholder="Email" autocomplete="username">
      <button onclick="handleForgotPassword()">Send Reset Email</button>
      <p class="auth-error" id="forgotError"></p>
      <p class="auth-success" id="forgotSuccess"></p>
      <p class="auth-switch"><a href="#" onclick="showPanel('signInPanel'); return false;">&larr; Back to sign in</a></p>
    </div>
  </div>
</div>

<div class="app-layout">
  <!-- Sidebar: account info, new chat, chat history list, logout -->
  <div class="sidebar">
    <div class="sidebar-top">
      <button id="sidebarNewChatBtn" onclick="startNewChat()">+ New Chat</button>
    </div>
    <div id="chatHistoryList" class="chat-history-list">
      <!-- Populated by JS with each saved chat topic -->
    </div>
    <div class="sidebar-bottom">
      <div class="account-wrapper">
        <div id="accountDropdown" class="account-dropdown" style="display:none;">
          <div class="account-dropdown-name" id="accountName"></div>
          <div class="account-dropdown-email" id="accountEmail"></div>
          <hr>
          <a href="terms.html" target="_blank" rel="noopener" class="account-dropdown-link">Terms &amp; Conditions</a>
          <div class="account-dropdown-privacy-note">Privacy settings: contact support to update your data preferences.</div>
        </div>
        <button id="accountBtn" onclick="toggleAccountDropdown()">Account ▾</button>
      </div>
      <button id="sidebarLogoutBtn" onclick="handleSignOut()">Log Out</button>
    </div>
  </div>

  <div class="chat-container">
    <div class="chat-header">
      <button id="backToSiteBtn" title="Back to Institute of AI" onclick="window.location.href='https://www.institute-of-ai.org'">
        <img src="logo.png" alt="Institute of AI" id="backLogo">
      </button>
      <div class="chat-title-block">
        <span id="chatHeaderTitle">GARNET-26 Chat</span>
        <span id="chatHeaderSubtitle">UNDER TRAINING</span>
      </div>
    </div>

    <div id="chat-box" class="chat-box"></div>

    <div class="chat-input">
      <div class="options">
        <button id="chatBtn" class="active" onclick="setMode('chat')">💬</button>
        <button id="webOptionBtn" title="Web Search" onclick="setMode('web')">🌐</button>
        <button id="goldPredBtn" title="Gold Prediction" onclick="quickAsk('What is your current gold price prediction?')">🥇</button>
      <button id="oilPredBtn" title="Oil Prediction" onclick="quickAsk('What is your current oil price prediction?')">🛢️</button>
      <button id="dxyPredBtn" title="Dollar Index Prediction" onclick="quickAsk('What is your current dollar index prediction?')">💵</button>
    </div>

    <input type="text" id="user-input" placeholder="Ask about the Institute of AI, gold or oil price predictions, or anything you may have in mind">

    <button id="sendBtn" title="Send" onclick="sendMessage()">
      <img src="https://cdn-icons-png.flaticon.com/512/724/724954.png" alt="Send">
    </button>
  </div>
</div>
</div>

<!-- Firebase Authentication SDK (compat build -- simplest to use without
     a module bundler). Handles real account creation, sign-in, and
     password-reset emails. -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<script>
  mermaid.initialize({ startOnLoad: false, theme: "dark" });
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>

<script>
  // ------------------------------------------------------------------
  // FIREBASE AUTHENTICATION
  // ------------------------------------------------------------------
  // ⚠️ REPLACE with YOUR OWN Firebase project's config -- get this from
  // Firebase Console > Project Settings > General > "Your apps" > Web
  // app > SDK setup and configuration. These values are meant to be
  // public/client-side per Firebase's own security model.
  const firebaseConfig = {
    apiKey: "AIzaSyDg684F5zl8U94jcajBDCn7XZt-UIB2BO8",
    authDomain: "garnet-chat-7d04a.firebaseapp.com",
    projectId: "garnet-chat-7d04a",
    storageBucket: "garnet-chat-7d04a.firebasestorage.app",
    messagingSenderId: "1041498206561",
    appId: "1:1041498206561:web:cce170fdabf3549bfc9520",
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  function showPanel(panelId) {
    ["signInPanel", "signUpPanel", "forgotPanel"].forEach((id) => {
      document.getElementById(id).style.display = id === panelId ? "block" : "none";
    });
    // Clear stale error/success messages when switching panels
    ["signInError", "signUpError", "forgotError", "forgotSuccess"].forEach((id) => {
      const el = document.getElementById(id);
      if (el) el.textContent = "";
    });
  }

  // Human-readable messages for Firebase's error codes, instead of
  // showing raw technical error strings to the user.
  function friendlyAuthError(error) {
    const map = {
      "auth/invalid-email": "Please enter a valid email address.",
      "auth/user-disabled": "This account has been disabled.",
      "auth/user-not-found": "No account found with that email.",
      "auth/wrong-password": "Incorrect password. Please try again.",
      "auth/invalid-credential": "Incorrect email or password.",
      "auth/email-already-in-use": "An account with that email already exists. Try signing in instead.",
      "auth/weak-password": "Password must be at least 6 characters.",
      "auth/too-many-requests": "Too many attempts. Please wait a moment and try again.",
    };
    return map[error.code] || "Something went wrong. Please try again.";
  }

  function handleSignIn() {
    const email = document.getElementById("signInEmail").value.trim();
    const password = document.getElementById("signInPassword").value;
    const errorEl = document.getElementById("signInError");
    errorEl.textContent = "";

    if (!email || !password) {
      errorEl.textContent = "Please enter your email and password.";
      return;
    }

    auth.signInWithEmailAndPassword(email, password).catch((error) => {
      errorEl.textContent = friendlyAuthError(error);
    });
    // On success, onAuthStateChanged (below) handles hiding the gate.
  }

  function handleSignUp() {
    const fullName = document.getElementById("signUpName").value.trim();
    const email = document.getElementById("signUpEmail").value.trim();
    const password = document.getElementById("signUpPassword").value;
    const confirmPassword = document.getElementById("signUpPasswordConfirm").value;
    const agreedToTerms = document.getElementById("agreeTerms").checked;
    const errorEl = document.getElementById("signUpError");
    errorEl.textContent = "";

    if (!fullName || !email || !password || !confirmPassword) {
      errorEl.textContent = "Please fill in all fields.";
      return;
    }
    if (password !== confirmPassword) {
      errorEl.textContent = "Passwords do not match.";
      return;
    }
    if (!agreedToTerms) {
      errorEl.textContent = "You must agree to the Terms & Conditions to create an account.";
      return;
    }

    auth.createUserWithEmailAndPassword(email, password)
      .then((credential) => credential.user.updateProfile({ displayName: fullName }))
      .catch((error) => {
        errorEl.textContent = friendlyAuthError(error);
      });
    // On success, onAuthStateChanged (below) handles hiding the gate.
  }

  function handleForgotPassword() {
    const email = document.getElementById("forgotEmail").value.trim();
    const errorEl = document.getElementById("forgotError");
    const successEl = document.getElementById("forgotSuccess");
    errorEl.textContent = "";
    successEl.textContent = "";

    if (!email) {
      errorEl.textContent = "Please enter your email address.";
      return;
    }

    auth.sendPasswordResetEmail(email)
      .then(() => {
        successEl.textContent = "Reset email sent! Check your inbox (and spam folder).";
      })
      .catch((error) => {
        errorEl.textContent = friendlyAuthError(error);
      });
  }

  function handleSignOut() {
    auth.signOut();
  }

  // The single source of truth for whether the gate is shown -- fires
  // on page load AND automatically whenever sign-in/sign-up/sign-out
  // happens, so the gate hides/shows itself correctly without needing
  // to manually toggle it in every handler above.
  let currentUid = null;
  let currentChatId = null; // null = unsaved "new chat" not yet persisted

  auth.onAuthStateChanged((user) => {
    const gate = document.getElementById("authGate");
    if (user) {
      gate.style.display = "none";
      currentUid = user.uid;
      document.getElementById("accountName").textContent = user.displayName || "(no name set)";
      document.getElementById("accountEmail").textContent = user.email || "";
      // IMPORTANT ORDER: load the real saved chat list FIRST, then call
      // startNewChat() -- startNewChat() adds a "pending" placeholder
      // folder to the top of the list for the chat about to start; if
      // loadChatList() ran afterward, its full list re-render would wipe
      // that placeholder back out before the user ever saw it.
      loadChatList().then(() => startNewChat());
    } else {
      gate.style.display = "flex";
      showPanel("signInPanel");
      currentUid = null;
      currentChatId = null;
      document.getElementById("chatHistoryList").innerHTML = "";
      document.getElementById("accountName").textContent = "";
      document.getElementById("accountEmail").textContent = "";
      document.getElementById("accountDropdown").style.display = "none";
    }
  });

  function toggleAccountDropdown() {
    const dropdown = document.getElementById("accountDropdown");
    dropdown.style.display = dropdown.style.display === "none" ? "block" : "none";
  }

  // Allow pressing Enter to submit each panel's form
  document.getElementById("signInPassword").addEventListener("keypress", (e) => {
    if (e.key === "Enter") handleSignIn();
  });
  document.getElementById("signUpPasswordConfirm").addEventListener("keypress", (e) => {
    if (e.key === "Enter") handleSignUp();
  });
  document.getElementById("forgotEmail").addEventListener("keypress", (e) => {
    if (e.key === "Enter") handleForgotPassword();
  });

  const API_URL = "https://ai-chat-backend-3-g573.onrender.com/chat";
  let mode = "chat";
  let conversationHistory = [];
  const userTimezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
  let isSending = false; // true while a request is in flight -- blocks new submissions until it resolves

  function setMode(selected) {
    mode = selected;
    document.getElementById("chatBtn").classList.toggle("active", mode === "chat");
    document.getElementById("webOptionBtn").classList.toggle("active", mode === "web");
    document.getElementById("chatHeaderTitle").textContent =
      mode === "chat" ? "GARNET-26 Chat" : "GARNET-26 Web Search";
  }

  function startNewChat() {
    document.getElementById("chat-box").innerHTML = "";
    conversationHistory = [];
    currentChatId = null;
    document.querySelectorAll(".chat-history-item").forEach((el) => el.classList.remove("active-chat"));

    // Show a "folder" for the new chat immediately, even before the first
    // message is sent -- gets naturally replaced by the real saved
    // folder once loadChatList() re-renders after the first message is
    // actually saved (see saveMessageToHistory).
    const existingPlaceholder = document.getElementById("pendingNewChatItem");
    if (existingPlaceholder) existingPlaceholder.remove();
    const listEl = document.getElementById("chatHistoryList");
    const placeholder = document.createElement("div");
    placeholder.id = "pendingNewChatItem";
    placeholder.className = "chat-history-item active-chat pending-chat";
    placeholder.innerHTML = '<span class="chat-history-item-title">📁 New Chat</span>';
    listEl.insertBefore(placeholder, listEl.firstChild);
  }

  // ------------------------------------------------------------------
  // CHAT HISTORY (Firestore) -- each signed-in user's chats live at
  // users/{uid}/chats/{chatId}, readable/writable only by that user
  // themselves (enforced by Firestore security rules, not by this
  // client-side code -- see the rules given alongside this feature).
  // Each chat is presented as a "folder" (folder icon + title) in the
  // sidebar, per the requested folder-based organization.
  // ------------------------------------------------------------------

  async function loadChatList() {
    if (!currentUid) return;
    const listEl = document.getElementById("chatHistoryList");
    try {
      const snapshot = await db.collection("users").doc(currentUid)
        .collection("chats").orderBy("updatedAt", "desc").get();

      if (snapshot.empty) {
        listEl.innerHTML = '<div class="chat-history-empty">No saved chats yet</div>';
        return;
      }

      listEl.innerHTML = "";
      snapshot.forEach((doc) => {
        const data = doc.data();
        const item = document.createElement("div");
        item.className = "chat-history-item" + (doc.id === currentChatId ? " active-chat" : "");
        item.onclick = () => loadChat(doc.id, data.title, data.messages || []);

        const titleSpan = document.createElement("span");
        titleSpan.className = "chat-history-item-title";
        titleSpan.textContent = "📁 " + (data.title || "Untitled chat");
        titleSpan.title = data.title || "Untitled chat"; // full title on hover, since the narrow sidebar truncates it

        const deleteBtn = document.createElement("button");
        deleteBtn.className = "chat-history-delete-btn";
        deleteBtn.title = "Delete this chat";
        deleteBtn.textContent = "✕";
        deleteBtn.onclick = (e) => {
          e.stopPropagation(); // don't also trigger loadChat when deleting
          deleteChat(doc.id);
        };

        item.appendChild(titleSpan);
        item.appendChild(deleteBtn);
        listEl.appendChild(item);
      });
    } catch (err) {
      console.error("Failed to load chat history:", err);
      listEl.innerHTML = '<div class="chat-history-empty">Could not load chat history</div>';
    }
  }

  function loadChat(chatId, title, messages) {
    currentChatId = chatId;
    document.getElementById("chat-box").innerHTML = "";
    conversationHistory = [];

    messages.forEach((msg) => {
      if (msg.role === "user") {
        addMessage(msg.content, "user");
        conversationHistory.push({ role: "user", content: msg.content });
      } else if (msg.role === "assistant") {
        addMessage(msg.htmlContent, "bot", true);
        conversationHistory.push({ role: "assistant", content: msg.rawContent });
      }
    });

    document.querySelectorAll(".chat-history-item").forEach((el) => el.classList.remove("active-chat"));
    // Re-render list so the correct item gets highlighted (simplest
    // correct way, given the list was built from a separate query).
    loadChatList();
  }

  async function deleteChat(chatId) {
    if (!currentUid) return;
    if (!confirm("Delete this chat? This cannot be undone.")) return;

    try {
      await db.collection("users").doc(currentUid).collection("chats").doc(chatId).delete();
      const wasActiveChat = chatId === currentChatId;
      await loadChatList(); // rebuild the real list first
      if (wasActiveChat) {
        startNewChat(); // then show the "new chat" placeholder on top of it
      }
    } catch (err) {
      console.error("Failed to delete chat:", err);
      alert("Could not delete this chat. Please try again.");
    }
  }

  // Saves the just-completed exchange to Firestore -- creates a new
  // chat document on the FIRST message of a new chat (title = a
  // truncated snippet of that first message, the same convention
  // ChatGPT/Claude-style history lists use), or appends to the existing
  // document for subsequent messages in the same chat.
  async function saveMessageToHistory(userText, htmlReply, rawReply) {
    if (!currentUid) return; // not signed in (shouldn't happen given the auth gate, but a safe no-op if it does)

    const userMsg = { role: "user", content: userText, ts: Date.now() };
    const assistantMsg = { role: "assistant", htmlContent: htmlReply, rawContent: rawReply, ts: Date.now() };

    try {
      if (!currentChatId) {
        const title = userText.length > 45 ? userText.slice(0, 45) + "..." : userText;
        const docRef = await db.collection("users").doc(currentUid).collection("chats").add({
          title,
          messages: [userMsg, assistantMsg],
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
        });
        currentChatId = docRef.id;
      } else {
        await db.collection("users").doc(currentUid).collection("chats").doc(currentChatId).update({
          messages: firebase.firestore.FieldValue.arrayUnion(userMsg, assistantMsg),
          updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
        });
      }
      loadChatList();
    } catch (err) {
      console.error("Failed to save chat history:", err);
      // Deliberately non-blocking -- a save failure shouldn't prevent
      // the user from continuing to chat, just means this exchange
      // won't be in their saved history.
    }
  }

  // Disables everything a user could use to submit a new message
  // (the text input, send button, and all quick-ask buttons) while
  // isSending is true, and restores them afterward. Prevents a second
  // request being fired while the first is still awaiting a reply --
  // both via the visible disabled state (can't type/click) and via the
  // isSending flag itself (a defensive second layer, e.g. against a
  // stray Enter keypress firing just before the DOM updates).
  function setSendingLock(locked) {
    isSending = locked;
    const input = document.getElementById("user-input");
    const sendBtn = document.getElementById("sendBtn");
    input.disabled = locked;
    sendBtn.disabled = locked;
    sendBtn.style.opacity = locked ? "0.5" : "1";
    sendBtn.style.cursor = locked ? "not-allowed" : "pointer";
    ["goldPredBtn", "oilPredBtn", "dxyPredBtn", "chatBtn", "webOptionBtn"].forEach((id) => {
      const btn = document.getElementById(id);
      if (btn) btn.disabled = locked;
    });
    if (!locked) input.focus();
  }

  function quickAsk(question) {
    if (isSending) return; // ignore quick-ask clicks while a request is already in flight
    const input = document.getElementById("user-input");
    input.value = question;
    sendMessage();
  }

  async function sendMessage() {
    if (isSending) return; // defensive guard against overlapping submissions

    const input = document.getElementById("user-input");
    const message = input.value.trim();
    if (!message) return;

    setSendingLock(true);
    addMessage(message, "user");
    input.value = "";
    const thinkingMsg = addThinkingMessage(mode);

    try {
      const response = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message, mode, history: conversationHistory, timezone: userTimezone }),
      });
      const data = await response.json();
      if (thinkingMsg.parentNode) thinkingMsg.remove();

      addMessage(data.reply || "No response received.", "bot", true);

      if (data.raw_reply) {
        conversationHistory.push({ role: "user", content: message });
        conversationHistory.push({ role: "assistant", content: data.raw_reply });
        saveMessageToHistory(message, data.reply || "", data.raw_reply);
      }
    } catch {
      if (thinkingMsg.parentNode) thinkingMsg.remove();
      addMessage("⚠️ Connection error. Try again.", "bot");
    } finally {
      setSendingLock(false); // always re-enable, whether the request succeeded, errored, or threw
    }
  }

  function renderPriceCharts(scopeEl) {
    const chartDivs = scopeEl.querySelectorAll('.price-chart:not([data-rendered="true"])');
    chartDivs.forEach((div) => {
      let chartData;
      try {
        chartData = JSON.parse(div.getAttribute("data-chart"));
      } catch (err) {
        console.error("Could not parse price chart data:", err);
        div.innerHTML = '<em style="opacity:0.7;">(Chart could not be displayed.)</em>';
        return;
      }

      const canvas = div.querySelector("canvas");
      if (!canvas) return;

      new Chart(canvas, {
        type: "line",
        data: {
          labels: chartData.labels || [],
          datasets: [{
            label: chartData.title || "Gold Price (USD/oz)",
            data: chartData.data || [],
            borderColor: "#4ea3ff",
            backgroundColor: "rgba(78, 163, 255, 0.12)",
            borderWidth: 2,
            pointRadius: 2,
            tension: 0.2,
            fill: true,
          }],
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            title: {
              display: !!chartData.title,
              text: chartData.title || "",
              color: "#ddd",
            },
            legend: { display: false },
          },
          scales: {
            x: { ticks: { maxTicksLimit: 8, color: "#aaa" }, grid: { color: "#333" } },
            y: { title: { display: true, text: "USD / oz", color: "#aaa" }, ticks: { color: "#aaa" }, grid: { color: "#333" } },
          },
        },
      });

      div.setAttribute("data-rendered", "true");
    });
  }

  function addMessage(text, sender, allowHTML = false) {
    const chatBox = document.getElementById("chat-box");
    const msg = document.createElement("div");
    msg.classList.add("message", sender === "user" ? "user-message" : "bot-message");

    const textSpan = document.createElement("span");
    if (allowHTML) {
      textSpan.innerHTML = text;
    } else {
      textSpan.textContent = text;
    }

    const copyBtn = document.createElement("button");
    copyBtn.classList.add("copy-btn");
    copyBtn.innerHTML = `
      <svg viewBox="0 0 24 24">
        <rect x="8" y="3" width="11" height="11" rx="2" ry="2"/>
        <rect x="3" y="8" width="11" height="11" rx="2" ry="2"/>
      </svg>
    `;
    copyBtn.title = "Copy message";
    copyBtn.onclick = () => {
      navigator.clipboard.writeText(textSpan.innerText);
      showCopiedToast();
    };

    msg.appendChild(textSpan);
    msg.appendChild(copyBtn);
    chatBox.appendChild(msg);
    chatBox.scrollTop = chatBox.scrollHeight;

    if (allowHTML) {
      const newDiagrams = textSpan.querySelectorAll(".mermaid");
      if (newDiagrams.length > 0 && typeof mermaid !== "undefined") {
        mermaid.run({ nodes: newDiagrams }).catch((err) => {
          console.error("Mermaid rendering failed:", err);
          newDiagrams.forEach((el) => {
            el.innerHTML =
              '<em style="opacity:0.7;">(A diagram was meant to appear here, but could not be displayed.)</em>';
          });
        });
      }

      if (typeof Chart !== "undefined") {
        renderPriceCharts(textSpan);
      }
    }
  }

  function addThinkingMessage(mode) {
    const chatBox = document.getElementById("chat-box");
    const msg = document.createElement("div");
    msg.classList.add("message", "bot-message", "thinking");
    msg.textContent = mode === "chat" ? "Thinking" : "Searching";
    chatBox.appendChild(msg);
    chatBox.scrollTop = chatBox.scrollHeight;
    return msg;
  }

  function showCopiedToast() {
    const toast = document.createElement("div");
    toast.textContent = "Copied!";
    toast.style.position = "fixed";
    toast.style.bottom = "20px";
    toast.style.right = "20px";
    toast.style.background = "#d9a441";
    toast.style.color = "#111";
    toast.style.padding = "8px 12px";
    toast.style.borderRadius = "8px";
    toast.style.fontSize = "14px";
    toast.style.boxShadow = "0 0 10px rgba(0,0,0,0.4)";
    toast.style.opacity = "0";
    toast.style.transition = "opacity 0.3s";
    document.body.appendChild(toast);
    setTimeout(() => (toast.style.opacity = "1"), 50);
    setTimeout(() => {
      toast.style.opacity = "0";
      setTimeout(() => toast.remove(), 300);
    }, 1200);
  }

  document.getElementById("user-input").addEventListener("keypress", e => {
    if (e.key === "Enter") {
      e.preventDefault();
      sendMessage();
    }
  });
</script>

</body>
